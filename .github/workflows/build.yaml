name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          
      - name: Generate Android Folder
        run: flutter create --project-name compressor_app .
        
      - name: Setup Android Manifest
        run: cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Patch Gradle Kotlin
        run: |
          echo 'buildscript {' > android/build.gradle
          echo '    ext.kotlin_version = "1.9.22"' >> android/build.gradle
          echo '    repositories { google(); mavenCentral() }' >> android/build.gradle
          echo '    dependencies { classpath "com.android.tools.build:gradle:8.1.0"; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }' >> android/build.gradle
          echo '}' >> android/build.gradle
          echo 'allprojects { repositories { google(); mavenCentral() } }' >> android/build.gradle
          echo 'rootProject.buildDir = "../build"' >> android/build.gradle
          echo 'subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }' >> android/build.gradle
          echo 'subprojects { project.evaluationDependsOn(":app") }' >> android/build.gradle
          echo 'tasks.register("clean", Delete) { delete rootProject.buildDir }' >> android/build.gradle
        
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
