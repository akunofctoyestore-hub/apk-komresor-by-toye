name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          
      - name: Generate Android Folder
        run: flutter create --project-name compressor_app .
        
      - name: Setup Android Manifest
        run: cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Patch Kotlin & SDK
        run: |
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          sed -i "s/flutter.compileSdkVersion/34/g" android/app/build.gradle
          sed -i "s/flutter.minSdkVersion/24/g" android/app/build.gradle
          sed -i "s/flutter.targetSdkVersion/34/g" android/app/build.gradle
        
      - name: Install Dependencies
        run: |
          rm -rf ~/.gradle/caches
          flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
